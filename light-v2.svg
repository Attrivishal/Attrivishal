<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610"
     role="img" aria-label="Vishal Attri — developer profile terminal banner (light theme)"
     font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <radialGradient id="l-bg1" cx="20%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="l-bg2" cx="85%" cy="85%" r="75%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="l-bg3" cx="55%" cy="110%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="l-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="l-ascii" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <filter id="l-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity=".08"/>
    </filter>

    <pattern id="l-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#06B6D4" opacity=".05"/>
    </pattern>

    <pattern id="l-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 0H32M0 0V32" stroke="#CBD5E1" stroke-width=".5" opacity=".6" fill="none"/>
    </pattern>

    <linearGradient id="l-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity=".75"/>
    </linearGradient>

    <clipPath id="l-clip">
      <rect x="48" y="130" width="410" height="410" rx="14"/>
    </clipPath>

    <clipPath id="l-type">
      <rect x="0" y="0" width="0" height="24">
        <animate attributeName="width" from="0" to="380" dur="1.6s" begin="1.4s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Outer background -->
  <rect width="1180" height="610" rx="24" fill="#FFFFFF"/>
  <rect width="1180" height="610" rx="24" fill="url(#l-grid)" opacity=".35"/>
  <rect width="1180" height="610" rx="24" fill="url(#l-bg1)"/>
  <rect width="1180" height="610" rx="24" fill="url(#l-bg2)"/>
  <rect width="1180" height="610" rx="24" fill="url(#l-bg3)"/>

  <rect x="1" y="1" width="1178" height="608" rx="23" fill="none" stroke="url(#l-accent)" stroke-width="1.2" opacity=".45">
    <animate attributeName="opacity" values=".3;.6;.3" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Top chrome bar -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur=".6s" fill="freeze"/>
    <rect x="24" y="24" width="1132" height="44" rx="12" fill="#F8FAFC" stroke="#E2E8F0" filter="url(#l-shadow)"/>
    <circle cx="52" cy="46" r="6" fill="#EF4444"/>
    <circle cx="74" cy="46" r="6" fill="#F59E0B"/>
    <circle cx="96" cy="46" r="6" fill="#10B981"/>
    <text x="590" y="51" fill="#475569" font-size="12" text-anchor="middle">vishal@cloud-devops:~</text>
    <text x="1120" y="51" fill="#047857" font-size="11" text-anchor="end">[ ONLINE ]</text>
  </g>

